services:
  paperless-ai:
    build: .
    container_name: paperless-ai-local
    network_mode: bridge
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    environment:
      - PUID=1000
      - PGID=1000
      - PAPERLESS_AI_PORT=${PAPERLESS_AI_PORT:-3001}
      - RAG_SERVICE_URL=http://localhost:8000
      - RAG_SERVICE_ENABLED=true
    ports:
      - "3001:${PAPERLESS_AI_PORT:-3001}"
    volumes:
      - paperless-ai_data:/app/data

volumes:
  paperless-ai_data:
